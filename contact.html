  <body>
    <div id="header"></div>

    <main>
      <section class="content-section hero-section-tight reveal" aria-labelledby="contact-title">
        <div class="container">
          <div class="row justify-content-center">
            <div class="col-lg-9">
              <div class="contact-card glass-card">
                <p class="eyebrow">Contact</p>
                <h1 id="contact-title" class="section-title mb-3">
                  Tell us what you need.
                </h1>
                <p class="section-subtitle text-start mb-4">
                  Whether you need a website, SEO, Google Ads, a bundled build, or ongoing maintenance, send the details below and we will follow up.
                </p>

                <form
                  name="contact"
                  method="POST"
                  data-netlify="true"
                  netlify-honeypot="bot-field"
                  class="contact-form">

                  <input type="hidden" name="form-name" value="contact" />

                  <p class="d-none">
                    <label>
                      Don’t fill this out if you’re human:
                      <input name="bot-field" />
                    </label>
                  </p>

                  <div class="row g-4">
                    <div class="col-md-6">
                      <label for="name" class="form-label">Name</label>
                      <input
                        id="name"
                        name="name"
                        type="text"
                        class="form-control"
                        autocomplete="name"
                        required />
                    </div>

                    <div class="col-md-6">
                      <label for="email" class="form-label">Email</label>
                      <input
                        id="email"
                        name="email"
                        type="email"
                        class="form-control"
                        autocomplete="email"
                        required />
                    </div>

                    <div class="col-12">
                      <label for="service" class="form-label">Service Needed</label>
                      <select id="service" name="service" class="form-select" required>
                        <option value="" selected disabled>Select one</option>
                        <option>Website Development</option>
                        <option>SEO</option>
                        <option>Google Ads</option>
                        <option>Website + Google Ads Bundle</option>
                        <option>Maintenance Retainer</option>
                        <option>Hosting & Deployment</option>
                        <option>Automation Systems</option>
                      </select>
                    </div>

                    <div class="col-12">
                      <label for="budget" class="form-label">Budget Range</label>
                      <select id="budget" name="budget" class="form-select">
                        <option>Not sure yet</option>
                        <option>$1,000 - $2,500</option>
                        <option>$2,500 - $5,000</option>
                        <option>$5,000 - $10,000</option>
                        <option>$10,000+</option>
                      </select>
                    </div>

                    <div class="col-12">
                      <label for="message" class="form-label">Project Details</label>
                      <textarea
                        id="message"
                        name="message"
                        rows="7"
                        class="form-control"
                        placeholder="Tell us what you need, your timeline, and what success looks like."
                        required></textarea>
                    </div>

                    <div class="col-12">
                      <button type="submit" class="btn btn-primary btn-lg w-100">
                        Send Inquiry
                      </button>
                    </div>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>
